<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel de Atendimento</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b141a; color: #e9edef;
      height: 100vh; height: 100dvh; overflow: hidden;
    }
    .app { display: flex; height: 100%; }
    .sidebar {
      width: 340px; background: #111b21; border-right: 1px solid #2a3942;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-header {
      background: #202c33; padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #2a3942;
    }
    .sidebar-header h1 { font-size: 17px; font-weight: 600; }
    .btn-novo {
      background: #00a884; color: white; border: none;
      padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .search-box { padding: 10px 12px; }
    .search-box input {
      width: 100%; background: #202c33; border: none; border-radius: 8px;
      padding: 10px 14px; color: #e9edef; font-size: 14px; outline: none;
    }
    .search-box input::placeholder { color: #8696a0; }
    .lista-clientes { flex: 1; overflow-y: auto; }
    .cliente-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #1e2a32;
    }
    .cliente-item:hover { background: #202c33; }
    .cliente-item.ativo { background: #2a3942; }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%; background: #00a884;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 600; color: white; flex-shrink: 0; text-transform: uppercase;
    }
    .cliente-info { flex: 1; min-width: 0; }
    .cliente-nome { font-size: 15px; font-weight: 500; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cliente-preview { font-size: 13px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cliente-hora { font-size: 12px; color: #8696a0; flex-shrink: 0; }
    .vazio-lista { padding: 40px 20px; text-align: center; color: #8696a0; font-size: 14px; line-height: 1.5; }
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; min-height: 0; overflow: hidden; }
    .chat-vazio {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #8696a0; text-align: center; padding: 40px;
    }
    .chat-vazio .icone { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
    .chat-vazio h2 { font-size: 20px; font-weight: 400; color: #e9edef; margin-bottom: 8px; }
    .chat-header {
      background: #202c33; padding: 12px 16px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid #2a3942; flex-shrink: 0;
    }
    .chat-header .avatar { width: 40px; height: 40px; font-size: 15px; }
    .chat-header-info h2 { font-size: 15px; font-weight: 500; }
    .chat-header-info span { font-size: 12px; color: #00a884; }
    .btn-copiar-link {
      margin-left: auto; background: transparent; border: 1px solid #3b4a54;
      color: #e9edef; padding: 7px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    #messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 8px; min-height: 0;
    }
    .msg {
      max-width: 80%; padding: 8px 12px; border-radius: 8px;
      font-size: 14.5px; line-height: 1.4; word-wrap: break-word;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.eu { background: #005c4b; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.outro { background: #202c33; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg .hora { font-size: 11px; color: rgba(233,237,239,0.55); margin-top: 4px; text-align: right; }
    .msg.outro .hora { text-align: left; }
    .msg img {
      max-width: 100%; max-height: 280px; border-radius: 8px;
      display: block; margin-bottom: 4px; cursor: pointer;
    }
    .msg video {
      max-width: 100%; max-height: 280px; border-radius: 8px;
      display: block; margin-bottom: 4px; background: #000;
    }
    .msg audio { width: 100%; min-width: 200px; margin: 4px 0; }
    .msg .arquivo {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: rgba(0,0,0,0.25);
      border-radius: 8px; margin-bottom: 4px; text-decoration: none; color: #e9edef;
    }
    .msg .arquivo:hover { background: rgba(0,0,0,0.35); }
    .input-area {
      background: #202c33; padding: 8px 10px;
      display: flex; gap: 4px; align-items: center;
      border-top: 1px solid #2a3942; flex-shrink: 0;
    }
    .btn-midia {
      background: transparent; border: none; color: #8696a0;
      font-size: 20px; cursor: pointer; padding: 6px; line-height: 1; flex-shrink: 0;
    }
    .btn-midia:hover { color: #00a884; }
    .btn-midia.gravando {
      color: #ef4444;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    #messageInput {
      flex: 1; background: #2a3942; border: none; border-radius: 8px;
      padding: 11px 14px; color: #e9edef; font-size: 15px; outline: none;
    }
    #messageInput::placeholder { color: #8696a0; }
    #sendBtn {
      background: #00a884; border: none; width: 44px; height: 44px;
      border-radius: 50%; color: white; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #sendBtn:disabled { background: #3b4a54; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-overlay.ativo { display: flex; }
    .modal {
      background: #202c33; border-radius: 12px; padding: 24px;
      width: 90%; max-width: 380px;
    }
    .modal h3 { font-size: 17px; margin-bottom: 16px; }
    .modal input {
      width: 100%; background: #2a3942; border: none; border-radius: 8px;
      padding: 12px 14px; color: #e9edef; font-size: 15px; outline: none; margin-bottom: 16px;
    }
    .modal-botoes { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-botoes button {
      padding: 9px 18px; border-radius: 6px; font-size: 14px; font-weight: 500;
      cursor: pointer; border: none;
    }
    .btn-cancelar { background: transparent; color: #8696a0; }
    .btn-criar { background: #00a884; color: white; }
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: #00a884; color: white; padding: 10px 20px;
      border-radius: 8px; font-size: 14px; z-index: 200; max-width: 90%;
    }
    .toast.erro { background: #d32f2f; }
    .uploading {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: #202c33; color: #e9edef; padding: 10px 20px;
      border-radius: 8px; font-size: 14px; z-index: 200; border: 1px solid #3b4a54;
    }
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: none; align-items: center; justify-content: center; z-index: 300;
      padding: 20px;
    }
    .lightbox.ativo { display: flex; }
    .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
    .lightbox .fechar {
      position: absolute; top: 16px; right: 16px; background: #333;
      color: white; border: none; width: 40px; height: 40px;
      border-radius: 50%; font-size: 20px; cursor: pointer;
    }
    @media (max-width: 700px) {
      .sidebar { width: 100%; }
      .chat-area { display: none; }
      .app.chat-aberto .sidebar { display: none; }
      .app.chat-aberto .chat-area { display: flex; }
    }
    .btn-voltar {
      display: none; background: transparent; border: none;
      color: #e9edef; font-size: 20px; cursor: pointer; margin-right: 4px;
    }
    @media (max-width: 700px) { .btn-voltar { display: block; } }
    input[type="file"] { display: none; }

    /* Proteção anti-print / anti-cópia (só no modo cliente) */
    body.modo-cliente {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }
    body.modo-cliente img,
    body.modo-cliente video,
    body.modo-cliente audio {
      pointer-events: none;
      -webkit-user-drag: none;
    }
    body.modo-cliente #messages {
      -webkit-user-select: none !important;
      user-select: none !important;
    }
    /* Permite digitar no input mesmo com user-select none */
    body.modo-cliente #messageInput,
    body.modo-cliente input,
    body.modo-cliente textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
      pointer-events: auto !important;
    }
  </style>
</head>
<body>

  <script>
    const SUPABASE_URL = 'https://hthcmhbcgmwprhgubiuy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Z_4elpCD5ygI-SV_2ljJug_gHW0ipa2';
    
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ========== CRIPTOGRAFIA (AES-GCM) ==========
    // Chave secreta do sistema — troque se quiser
    const CHAVE_SECRETA = 'AtendimentoSecreto2026!';

    async function derivarChave(conversaId) {
      const enc = new TextEncoder();
      const material = await crypto.subtle.importKey(
        'raw',
        enc.encode(CHAVE_SECRETA + ':' + conversaId),
        'PBKDF2',
        false,
        ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: enc.encode('sal-atendimento-v1'),
          iterations: 100000,
          hash: 'SHA-256'
        },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function criptografarTexto(texto, conversaId) {
      const key = await derivarChave(conversaId);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(texto);
      const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
      // Formato: enc:base64(iv + ciphertext)
      const combined = new Uint8Array(iv.length + cipher.byteLength);
      combined.set(iv, 0);
      combined.set(new Uint8Array(cipher), iv.length);
      let binary = '';
      combined.forEach(b => binary += String.fromCharCode(b));
      return 'enc:' + btoa(binary);
    }

    async function descriptografarTexto(texto, conversaId) {
      if (!texto || !texto.startsWith('enc:')) return texto;
      try {
        const key = await derivarChave(conversaId);
        const raw = atob(texto.slice(4));
        const bytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        const iv = bytes.slice(0, 12);
        const data = bytes.slice(12);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
        return new TextDecoder().decode(plain);
      } catch (e) {
        console.error('Falha ao descriptografar:', e);
        return '[mensagem criptografada]';
      }
    }

    async function criptografarBlob(blob, conversaId) {
      const key = await derivarChave(conversaId);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const buffer = await blob.arrayBuffer();
      const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, buffer);
      const combined = new Uint8Array(iv.length + cipher.byteLength);
      combined.set(iv, 0);
      combined.set(new Uint8Array(cipher), iv.length);
      return new Blob([combined], { type: 'application/octet-stream' });
    }

    async function descriptografarBlob(encryptedBlob, conversaId, mimeType) {
      try {
        const key = await derivarChave(conversaId);
        const buffer = await encryptedBlob.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        const iv = bytes.slice(0, 12);
        const data = bytes.slice(12);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
        return new Blob([plain], { type: mimeType || 'application/octet-stream' });
      } catch (e) {
        console.error('Falha ao descriptografar arquivo:', e);
        return null;
      }
    }


    let conversas = [];
    let conversaAtual = null;
    let channelMensagens = null;
    let isCliente = false;
    let tipoArquivoAtual = 'arquivo';
    let mediaRecorder = null;
    let audioChunks = [];
    let gravando = false;
    let streamAudio = null;

    // Pede permissões ao carregar (câmera/microfone)
    async function pedirPermissoes() {
      try {
        // Só pede se o navegador suportar
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          // Não força agora para não assustar; pede quando clicar no áudio/foto
        }
      } catch(e) {}
    }

    // ========== GRAVAÇÃO DE ÁUDIO ==========
    
    // ========== PROTEÇÃO ANTI-PRINT (só cliente) ==========
    function ativarProtecaoCliente() {
      // Bloqueia clique direito
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });

      // Bloqueia atalhos de print / copiar / salvar
      document.addEventListener('keydown', function(e) {
        // PrintScreen, Ctrl+P, Ctrl+S, Ctrl+C, Ctrl+A, Ctrl+U, F12
        if (
          e.key === 'PrintScreen' ||
          (e.ctrlKey && (e.key === 'p' || e.key === 'P' || e.key === 's' || e.key === 'S' || e.key === 'c' || e.key === 'C' || e.key === 'a' || e.key === 'A' || e.key === 'u' || e.key === 'U')) ||
          (e.metaKey && (e.key === 'p' || e.key === 'P' || e.key === 's' || e.key === 'S' || e.key === 'c' || e.key === 'C')) ||
          e.key === 'F12'
        ) {
          e.preventDefault();
          mostrarToast('Ação bloqueada', true);
          return false;
        }
      });

      // Bloqueia arrastar imagens
      document.addEventListener('dragstart', function(e) {
        e.preventDefault();
        return false;
      });

      // Tenta detectar perda de foco (às vezes usado em print)
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          // Opcional: esconder conteúdo quando sair da aba
          const msgs = document.getElementById('messages');
          if (msgs) msgs.style.filter = 'blur(20px)';
        } else {
          const msgs = document.getElementById('messages');
          if (msgs) msgs.style.filter = 'none';
        }
      });
    }


    async function toggleGravacao() {
      if (gravando) {
        pararGravacao();
      } else {
        await iniciarGravacao();
      }
    }

    async function iniciarGravacao() {
      if (!conversaAtual) {
        mostrarToast('Abra uma conversa primeiro', true);
        return;
      }
      try {
        // Pede permissão do microfone
        mostrarToast('Pedindo permissão do microfone...');
        streamAudio = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true
          }
        });
        
        audioChunks = [];
        const options = {};
        // Prefere formatos mais compatíveis
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
          options.mimeType = 'audio/webm;codecs=opus';
        } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
          options.mimeType = 'audio/mp4';
        } else if (MediaRecorder.isTypeSupported('audio/ogg')) {
          options.mimeType = 'audio/ogg';
        }

        mediaRecorder = new MediaRecorder(streamAudio, options);
        
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          const mime = mediaRecorder.mimeType || 'audio/webm';
          const blob = new Blob(audioChunks, { type: mime });
          
          // Para as tracks do microfone
          if (streamAudio) {
            streamAudio.getTracks().forEach(t => t.stop());
            streamAudio = null;
          }

          if (blob.size < 1000) {
            mostrarToast('Áudio muito curto', true);
            return;
          }

          await enviarBlobAudio(blob, mime);
        };

        mediaRecorder.start(250);
        gravando = true;
        
        const btn = document.getElementById('btnAudio');
        if (btn) {
          btn.classList.add('gravando');
          btn.textContent = '⏹';
          btn.title = 'Parar gravação';
        }
        mostrarToast('🔴 GRAVANDO — toque no microfone de novo para enviar');

      } catch (err) {
        console.error(err);
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          mostrarToast('Permissão de microfone negada. Ative nas configurações do navegador.', true);
        } else {
          mostrarToast('Erro ao acessar microfone: ' + err.message, true);
        }
      }
    }

    function pararGravacao() {
      if (mediaRecorder && gravando) {
        mediaRecorder.stop();
        gravando = false;
        const btn = document.getElementById('btnAudio');
        if (btn) {
          btn.classList.remove('gravando');
          btn.textContent = '🎤';
          btn.title = 'Gravar áudio';
        }
      }
    }

    async function enviarBlobAudio(blob, mime) {
      const toast = document.createElement('div');
      toast.className = 'uploading';
      toast.textContent = 'Enviando áudio...';
      document.body.appendChild(toast);

      try {
        let ext = 'webm';
        if (mime.includes('mp4')) ext = 'm4a';
        else if (mime.includes('ogg')) ext = 'ogg';
        else if (mime.includes('mpeg')) ext = 'mp3';

        const nomeArquivo = conversaAtual.id + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) + '.' + ext;

        let blobFinal = blob;
        let mimeFinal = mime;
        let nomeFinal = nomeArquivo;
        const remetente = isCliente ? 'cliente' : 'agente';

        if (remetente === 'agente') {
          blobFinal = await criptografarBlob(blob, conversaAtual.id);
          mimeFinal = 'application/octet-stream';
          nomeFinal = nomeArquivo + '.enc';
        }

        const { error: uploadError } = await supabaseClient.storage
          .from('midias')
          .upload(nomeFinal, blobFinal, {
            cacheControl: '3600',
            upsert: false,
            contentType: mimeFinal
          });

        if (uploadError) throw uploadError;

        const { data: urlData } = supabaseClient.storage
          .from('midias')
          .getPublicUrl(nomeFinal);

        const url = urlData.publicUrl;
        let textoAudio = 'Áudio';
        if (remetente === 'agente') {
          try { textoAudio = await criptografarTexto('Áudio', conversaAtual.id); } catch(e) {}
        }

        const { error: msgError } = await supabaseClient.from('mensagens').insert([{
          conversa_id: conversaAtual.id,
          texto: textoAudio,
          remetente: remetente,
          tipo: 'audio',
          url_midia: url
        }]);

        if (msgError) throw msgError;

        await supabaseClient.from('conversas')
          .update({ updated_at: new Date().toISOString() })
          .eq('id', conversaAtual.id);

        mostrarToast('Áudio enviado!');
      } catch (err) {
        console.error(err);
        mostrarToast('Erro ao enviar áudio: ' + (err.message || err), true);
      } finally {
        toast.remove();
      }
    }

    function detectarModo() {
      const params = new URLSearchParams(window.location.search);
      const sala = params.get('sala');
      isCliente = params.get('cliente') === '1';
      if (sala && isCliente) {
        document.querySelector('.sidebar').style.display = 'none';
        document.body.classList.add('modo-cliente');
        ativarProtecaoCliente();
        abrirConversaPorId(sala);
      } else {
        carregarConversas();
      }
      pedirPermissoes();
    }

    async function carregarConversas() {
      const { data, error } = await supabaseClient
        .from('conversas').select('*').order('updated_at', { ascending: false });
      if (error) {
        document.getElementById('listaClientes').innerHTML = '<div class="vazio-lista">Erro ao carregar</div>';
        return;
      }
      conversas = data || [];
      renderizarLista();
    }

    function renderizarLista(filtro = '') {
      const container = document.getElementById('listaClientes');
      let lista = filtro ? conversas.filter(c => c.nome.toLowerCase().includes(filtro.toLowerCase())) : conversas;
      if (lista.length === 0) {
        container.innerHTML = '<div class="vazio-lista">Nenhum cliente ainda.<br>Clique em "+ Novo".</div>';
        return;
      }
      container.innerHTML = lista.map(c => {
        const ativo = conversaAtual && conversaAtual.id === c.id ? 'ativo' : '';
        return `<div class="cliente-item ${ativo}" onclick="abrirConversa('${c.id}')">
          <div class="avatar">${c.nome.charAt(0).toUpperCase()}</div>
          <div class="cliente-info">
            <div class="cliente-nome">${escapeHtml(c.nome)}</div>
            <div class="cliente-preview">Clique para abrir</div>
          </div>
          <div class="cliente-hora">${formatarHora(c.updated_at)}</div>
        </div>`;
      }).join('');
    }

    function filtrarClientes() {
      renderizarLista(document.getElementById('busca').value);
    }

    function abrirModalNovo() {
      document.getElementById('modalNovo').classList.add('ativo');
      document.getElementById('inputNome').value = '';
      setTimeout(() => document.getElementById('inputNome').focus(), 100);
    }
    function fecharModal() {
      document.getElementById('modalNovo').classList.remove('ativo');
    }

    async function criarCliente() {
      const nome = document.getElementById('inputNome').value.trim();
      if (!nome) return alert('Digite o nome do cliente');
      const id = Math.random().toString(36).substring(2, 10) + Date.now().toString(36).slice(-4);
      const { error } = await supabaseClient.from('conversas').insert([{ id, nome }]);
      if (error) return alert('Erro: ' + error.message);
      fecharModal();
      await carregarConversas();
      abrirConversa(id);
      mostrarToast('Cliente criado!');
    }

    document.getElementById('inputNome').addEventListener('keypress', e => {
      if (e.key === 'Enter') criarCliente();
    });

    async function abrirConversa(id) {
      let conversa = conversas.find(c => c.id === id);
      if (!conversa) {
        const { data } = await supabaseClient.from('conversas').select('*').eq('id', id).single();
        if (!data) return alert('Conversa não encontrada');
        conversaAtual = data;
      } else {
        conversaAtual = conversa;
      }
      mostrarChatUI();
      await carregarMensagens();
      escutarMensagens();
    }

    async function abrirConversaPorId(id) {
      const { data, error } = await supabaseClient.from('conversas').select('*').eq('id', id).single();
      if (error || !data) {
        document.getElementById('chatArea').innerHTML = '<div class="chat-vazio"><h2>Conversa não encontrada</h2></div>';
        return;
      }
      conversas = [data];
      conversaAtual = data;
      document.querySelector('.sidebar').style.display = 'none';
      const btn = document.querySelector('.btn-copiar-link');
      if (btn) btn.style.display = 'none';
      mostrarChatUI();
      await carregarMensagens();
      escutarMensagens();
    }

    function mostrarChatUI() {
      document.getElementById('chatVazio').style.display = 'none';
      const el = document.getElementById('chatAtivo');
      el.style.display = 'flex';
      el.style.flexDirection = 'column';
      el.style.height = '100%';
      el.style.flex = '1';
      el.style.minHeight = '0';
      document.getElementById('chatNome').textContent = conversaAtual.nome;
      document.getElementById('chatAvatar').textContent = conversaAtual.nome.charAt(0).toUpperCase();
      document.getElementById('app').classList.add('chat-aberto');
      renderizarLista(document.getElementById('busca')?.value || '');
      setTimeout(() => document.getElementById('messageInput')?.focus(), 200);
    }

    function fecharChatMobile() {
      document.getElementById('app').classList.remove('chat-aberto');
      conversaAtual = null;
      if (channelMensagens) {
        supabaseClient.removeChannel(channelMensagens);
        channelMensagens = null;
      }
    }

    async function carregarMensagens() {
      if (!conversaAtual) return;
      const { data, error } = await supabaseClient
        .from('mensagens').select('*')
        .eq('conversa_id', conversaAtual.id)
        .order('created_at', { ascending: true });
      const container = document.getElementById('messages');
      container.innerHTML = '';
      if (error) return console.error(error);
      (data || []).forEach(msg => adicionarMensagemNaTela(msg));
      scrollParaBaixo();
    }

    function escutarMensagens() {
      if (channelMensagens) supabaseClient.removeChannel(channelMensagens);
      if (!conversaAtual) return;
      channelMensagens = supabaseClient
        .channel('msgs-' + conversaAtual.id)
        .on('postgres_changes', {
          event: 'INSERT', schema: 'public', table: 'mensagens',
          filter: 'conversa_id=eq.' + conversaAtual.id
        }, payload => {
          adicionarMensagemNaTela(payload.new);
          scrollParaBaixo();
        })
        .subscribe();
    }

    function adicionarMensagemNaTela(msg) {
      if (document.querySelector('[data-id="' + msg.id + '"]')) return;
      const div = document.createElement('div');
      const souEu = isCliente ? (msg.remetente === 'cliente') : (msg.remetente === 'agente');
      div.className = 'msg ' + (souEu ? 'eu' : 'outro');
      div.setAttribute('data-id', msg.id);

      const tipo = (msg.tipo || 'texto').toLowerCase();
      let url = (msg.url_midia || '').trim();
      const hora = new Date(msg.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const isEncryptedFile = url.endsWith('.enc') || url.includes('.enc');

      // Processa de forma assíncrona (descriptografia)
      (async () => {
        let texto = msg.texto || '';
        
        // Descriptografa texto se necessário
        if (texto.startsWith('enc:') && conversaAtual) {
          texto = await descriptografarTexto(texto, conversaAtual.id);
        }

        if (url && (tipo === 'imagem' || tipo === 'image' || tipo === 'foto')) {
          if (isEncryptedFile && conversaAtual) {
            try {
              const resp = await fetch(url);
              const encBlob = await resp.blob();
              const decBlob = await descriptografarBlob(encBlob, conversaAtual.id, 'image/jpeg');
              if (decBlob) {
                url = URL.createObjectURL(decBlob);
              }
            } catch (e) {
              console.error('Erro dec img:', e);
            }
          }
          const img = document.createElement('img');
          img.src = url;
          img.alt = 'imagem';
          img.loading = 'lazy';
          img.style.maxWidth = '100%';
          img.style.maxHeight = '280px';
          img.style.borderRadius = '8px';
          img.style.display = 'block';
          img.style.marginBottom = '4px';
          img.style.cursor = 'pointer';
          img.onclick = function() { abrirLightbox(url); };
          img.onerror = function() {
            const a = document.createElement('a');
            a.href = msg.url_midia;
            a.target = '_blank';
            a.style.color = '#7dd3c0';
            a.textContent = '📷 Abrir imagem';
            img.replaceWith(a);
          };
          div.insertBefore(img, div.firstChild);
        } else if (url && tipo === 'video') {
          if (isEncryptedFile && conversaAtual) {
            try {
              const resp = await fetch(url);
              const encBlob = await resp.blob();
              const decBlob = await descriptografarBlob(encBlob, conversaAtual.id, 'video/mp4');
              if (decBlob) url = URL.createObjectURL(decBlob);
            } catch (e) { console.error(e); }
          }
          const video = document.createElement('video');
          video.src = url;
          video.controls = true;
          video.playsInline = true;
          video.preload = 'metadata';
          video.style.maxWidth = '100%';
          video.style.maxHeight = '280px';
          video.style.borderRadius = '8px';
          video.style.display = 'block';
          video.style.marginBottom = '4px';
          video.style.background = '#000';
          div.insertBefore(video, div.firstChild);
        } else if (url && tipo === 'audio') {
          if (isEncryptedFile && conversaAtual) {
            try {
              const resp = await fetch(url);
              const encBlob = await resp.blob();
              const decBlob = await descriptografarBlob(encBlob, conversaAtual.id, 'audio/webm');
              if (decBlob) url = URL.createObjectURL(decBlob);
            } catch (e) { console.error(e); }
          }
          const wrap = document.createElement('div');
          wrap.style.display = 'flex';
          wrap.style.flexDirection = 'column';
          wrap.style.gap = '6px';
          wrap.style.minWidth = '220px';
          const audio = document.createElement('audio');
          audio.src = url;
          audio.controls = true;
          audio.preload = 'auto';
          audio.style.width = '100%';
          audio.load();
          audio.onerror = function() {
            const a = document.createElement('a');
            a.href = msg.url_midia;
            a.target = '_blank';
            a.style.color = '#7dd3c0';
            a.textContent = '🎤 Baixar / abrir áudio';
            wrap.innerHTML = '';
            wrap.appendChild(a);
          };
          wrap.appendChild(audio);
          div.insertBefore(wrap, div.firstChild);
        } else if (url) {
          const a = document.createElement('a');
          a.className = 'arquivo';
          a.href = url;
          a.target = '_blank';
          const nomeArquivo = texto.startsWith('enc:') ? 'Arquivo' : (texto || 'Baixar arquivo');
          a.innerHTML = '<span style="font-size:24px">📄</span><span>' + escapeHtml(nomeArquivo) + '</span>';
          div.insertBefore(a, div.firstChild);
        }

        if (texto && tipo === 'texto') {
          // Insere o texto no início (antes da hora)
          const span = document.createElement('span');
          span.textContent = texto;
          const horaEl = div.querySelector('.hora');
          if (horaEl) div.insertBefore(span, horaEl);
          else div.appendChild(span);
        }

        // Cadeado visual para mensagens criptografadas do admin
        if (msg.remetente === 'agente' && (msg.texto || '').startsWith('enc:')) {
          const lock = document.createElement('span');
          lock.textContent = ' 🔒';
          lock.style.fontSize = '11px';
          lock.title = 'Mensagem criptografada';
          const horaEl = div.querySelector('.hora');
          if (horaEl) horaEl.appendChild(lock);
        }
      })();

      const horaDiv = document.createElement('div');
      horaDiv.className = 'hora';
      horaDiv.textContent = hora;
      div.appendChild(horaDiv);

      document.getElementById('messages').appendChild(div);
    }

    function abrirLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.add('ativo');
    }
    function fecharLightbox() {
      document.getElementById('lightbox').classList.remove('ativo');
    }

    async function enviarMensagem() {
      if (!conversaAtual) return;
      const input = document.getElementById('messageInput');
      let texto = input.value.trim();
      if (!texto) return;
      const remetente = isCliente ? 'cliente' : 'agente';
      input.value = '';
      document.getElementById('sendBtn').disabled = true;

      // Criptografa se for o administrador
      let textoFinal = texto;
      if (remetente === 'agente') {
        try {
          textoFinal = await criptografarTexto(texto, conversaAtual.id);
        } catch (e) {
          console.error(e);
          mostrarToast('Erro ao criptografar', true);
          document.getElementById('sendBtn').disabled = false;
          return;
        }
      }

      const { error } = await supabaseClient.from('mensagens').insert([{
        conversa_id: conversaAtual.id, texto: textoFinal, remetente, tipo: 'texto'
      }]);
      await supabaseClient.from('conversas')
        .update({ updated_at: new Date().toISOString() })
        .eq('id', conversaAtual.id);
      document.getElementById('sendBtn').disabled = false;
      input.focus();
      if (error) mostrarToast('Erro: ' + error.message, true);
    }

    function escolherArquivo(tipo) {
      tipoArquivoAtual = tipo;
      const input = document.getElementById('fileInput');
      if (tipo === 'imagem') input.accept = 'image/*';
      else if (tipo === 'video') input.accept = 'video/*';
      else if (tipo === 'audio') input.accept = 'audio/*';
      else input.accept = '*/*';
      input.click();
    }

    async function enviarArquivo(event) {
      const file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file || !conversaAtual) return;

      if (file.size > 50 * 1024 * 1024) {
        mostrarToast('Arquivo muito grande (máx 50MB)', true);
        return;
      }

      const toast = document.createElement('div');
      toast.className = 'uploading';
      toast.textContent = 'Enviando... aguarde';
      document.body.appendChild(toast);

      try {
        // Detecta tipo pelo MIME se necessário
        let tipo = tipoArquivoAtual;
        if (file.type.startsWith('image/')) tipo = 'imagem';
        else if (file.type.startsWith('video/')) tipo = 'video';
        else if (file.type.startsWith('audio/')) tipo = 'audio';
        else if (tipoArquivoAtual === 'arquivo') tipo = 'arquivo';

        const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
        const nomeArquivo = conversaAtual.id + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) + '.' + ext;

        // Upload
        // Define content-type correto para áudio
        let contentType = file.type || 'application/octet-stream';
        if (tipo === 'audio') {
          if (!contentType || contentType === 'application/octet-stream') {
            if (ext === 'mp3') contentType = 'audio/mpeg';
            else if (ext === 'ogg') contentType = 'audio/ogg';
            else if (ext === 'wav') contentType = 'audio/wav';
            else if (ext === 'm4a' || ext === 'mp4') contentType = 'audio/mp4';
            else if (ext === 'webm') contentType = 'audio/webm';
            else contentType = 'audio/mpeg';
          }
        } else if (tipo === 'imagem' && (!contentType || contentType === 'application/octet-stream')) {
          contentType = 'image/jpeg';
        }

        let fileToUpload = file;
        let contentTypeFinal = contentType;
        let nomeFinal = nomeArquivo;

        // Criptografa mídia se for o administrador
        const remetenteCheck = isCliente ? 'cliente' : 'agente';
        if (remetenteCheck === 'agente') {
          fileToUpload = await criptografarBlob(file, conversaAtual.id);
          contentTypeFinal = 'application/octet-stream';
          // marca arquivo como criptografado no nome
          nomeFinal = nomeArquivo + '.enc';
        }

        const { data: uploadData, error: uploadError } = await supabaseClient.storage
          .from('midias')
          .upload(nomeFinal, fileToUpload, {
            cacheControl: '3600',
            upsert: false,
            contentType: contentTypeFinal
          });

        if (uploadError) {
          console.error('Upload error:', uploadError);
          throw new Error(uploadError.message || 'Falha no upload');
        }

        // URL pública
        const { data: urlData } = supabaseClient.storage
          .from('midias')
          .getPublicUrl(nomeFinal);

        const url = urlData.publicUrl;
        if (!url) throw new Error('Não foi possível gerar URL do arquivo');

        const remetente = isCliente ? 'cliente' : 'agente';
        let texto = (tipo === 'arquivo') ? file.name : (file.name || '');

        // Marca texto como criptografado se admin
        if (remetente === 'agente' && texto) {
          try { texto = await criptografarTexto(texto, conversaAtual.id); } catch(e) {}
        }

        const { error: msgError } = await supabaseClient.from('mensagens').insert([{
          conversa_id: conversaAtual.id,
          texto: texto,
          remetente: remetente,
          tipo: tipo,
          url_midia: url
        }]);

        if (msgError) {
          console.error('Msg error:', msgError);
          throw new Error(msgError.message || 'Erro ao salvar mensagem');
        }

        await supabaseClient.from('conversas')
          .update({ updated_at: new Date().toISOString() })
          .eq('id', conversaAtual.id);

        mostrarToast('Enviado!');

      } catch (err) {
        console.error(err);
        mostrarToast('Erro: ' + (err.message || 'Falha ao enviar'), true);
      } finally {
        toast.remove();
      }
    }

    document.getElementById('messageInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') { e.preventDefault(); enviarMensagem(); }
    });

    function copiarLinkCliente() {
      if (!conversaAtual) return;
      let base = window.location.href.split('?')[0].split('#')[0];
      const link = base + '?sala=' + conversaAtual.id + '&cliente=1';
      prompt('Copie o link e envie para o cliente:', link);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(link).then(() => mostrarToast('Link copiado!')).catch(() => {});
      }
    }

    function formatarHora(data) {
      if (!data) return '';
      const d = new Date(data);
      const agora = new Date();
      if (agora - d < 86400000 && d.getDate() === agora.getDate()) {
        return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      }
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function scrollParaBaixo() {
      const c = document.getElementById('messages');
      if (c) c.scrollTop = c.scrollHeight;
    }

    function mostrarToast(texto, erro = false) {
      const t = document.createElement('div');
      t.className = 'toast' + (erro ? ' erro' : '');
      t.textContent = texto;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    detectarModo();
  </script>
</body>
</html>
