<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel de Atendimento</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b141a; color: #e9edef;
      height: 100vh; height: 100dvh; overflow: hidden;
    }
    .app { display: flex; height: 100%; }
    .sidebar {
      width: 340px; background: #111b21; border-right: 1px solid #2a3942;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-header {
      background: #202c33; padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #2a3942;
    }
    .sidebar-header h1 { font-size: 17px; font-weight: 600; }
    .btn-novo {
      background: #00a884; color: white; border: none;
      padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .search-box { padding: 10px 12px; }
    .search-box input {
      width: 100%; background: #202c33; border: none; border-radius: 8px;
      padding: 10px 14px; color: #e9edef; font-size: 14px; outline: none;
    }
    .search-box input::placeholder { color: #8696a0; }
    .lista-clientes { flex: 1; overflow-y: auto; }
    .cliente-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #1e2a32;
    }
    .cliente-item:hover { background: #202c33; }
    .cliente-item.ativo { background: #2a3942; }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%; background: #00a884;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 600; color: white; flex-shrink: 0; text-transform: uppercase;
    }
    .cliente-info { flex: 1; min-width: 0; }
    .cliente-nome { font-size: 15px; font-weight: 500; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cliente-preview { font-size: 13px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cliente-hora { font-size: 12px; color: #8696a0; flex-shrink: 0; }
    .vazio-lista { padding: 40px 20px; text-align: center; color: #8696a0; font-size: 14px; line-height: 1.5; }
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; min-height: 0; overflow: hidden; }
    .chat-vazio {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #8696a0; text-align: center; padding: 40px;
    }
    .chat-vazio .icone { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
    .chat-vazio h2 { font-size: 20px; font-weight: 400; color: #e9edef; margin-bottom: 8px; }
    .chat-header {
      background: #202c33; padding: 12px 16px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid #2a3942; flex-shrink: 0;
    }
    .chat-header .avatar { width: 40px; height: 40px; font-size: 15px; }
    .chat-header-info h2 { font-size: 15px; font-weight: 500; }
    .chat-header-info span { font-size: 12px; color: #00a884; }
    .btn-copiar-link {
      margin-left: auto; background: transparent; border: 1px solid #3b4a54;
      color: #e9edef; padding: 7px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    #messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 8px; min-height: 0;
    }
    .msg {
      max-width: 80%; padding: 8px 12px; border-radius: 8px;
      font-size: 14.5px; line-height: 1.4; word-wrap: break-word;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.eu { background: #005c4b; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.outro { background: #202c33; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg .hora { font-size: 11px; color: rgba(233,237,239,0.55); margin-top: 4px; text-align: right; }
    .msg.outro .hora { text-align: left; }
    .msg img {
      max-width: 100%; max-height: 280px; border-radius: 8px;
      display: block; margin-bottom: 4px; cursor: pointer;
    }
    .msg video {
      max-width: 100%; max-height: 280px; border-radius: 8px;
      display: block; margin-bottom: 4px; background: #000;
    }
    .msg audio { width: 100%; min-width: 200px; margin: 4px 0; }
    .msg .arquivo {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: rgba(0,0,0,0.25);
      border-radius: 8px; margin-bottom: 4px; text-decoration: none; color: #e9edef;
    }
    .msg .arquivo:hover { background: rgba(0,0,0,0.35); }
    .input-area {
      background: #202c33; padding: 8px 10px;
      display: flex; gap: 4px; align-items: center;
      border-top: 1px solid #2a3942; flex-shrink: 0;
    }
    .btn-midia {
      background: transparent; border: none; color: #8696a0;
      font-size: 20px; cursor: pointer; padding: 6px; line-height: 1; flex-shrink: 0;
    }
    .btn-midia:hover { color: #00a884; }
    #messageInput {
      flex: 1; background: #2a3942; border: none; border-radius: 8px;
      padding: 11px 14px; color: #e9edef; font-size: 15px; outline: none;
    }
    #messageInput::placeholder { color: #8696a0; }
    #sendBtn {
      background: #00a884; border: none; width: 44px; height: 44px;
      border-radius: 50%; color: white; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #sendBtn:disabled { background: #3b4a54; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-overlay.ativo { display: flex; }
    .modal {
      background: #202c33; border-radius: 12px; padding: 24px;
      width: 90%; max-width: 380px;
    }
    .modal h3 { font-size: 17px; margin-bottom: 16px; }
    .modal input {
      width: 100%; background: #2a3942; border: none; border-radius: 8px;
      padding: 12px 14px; color: #e9edef; font-size: 15px; outline: none; margin-bottom: 16px;
    }
    .modal-botoes { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-botoes button {
      padding: 9px 18px; border-radius: 6px; font-size: 14px; font-weight: 500;
      cursor: pointer; border: none;
    }
    .btn-cancelar { background: transparent; color: #8696a0; }
    .btn-criar { background: #00a884; color: white; }
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: #00a884; color: white; padding: 10px 20px;
      border-radius: 8px; font-size: 14px; z-index: 200; max-width: 90%;
    }
    .toast.erro { background: #d32f2f; }
    .uploading {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: #202c33; color: #e9edef; padding: 10px 20px;
      border-radius: 8px; font-size: 14px; z-index: 200; border: 1px solid #3b4a54;
    }
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: none; align-items: center; justify-content: center; z-index: 300;
      padding: 20px;
    }
    .lightbox.ativo { display: flex; }
    .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
    .lightbox .fechar {
      position: absolute; top: 16px; right: 16px; background: #333;
      color: white; border: none; width: 40px; height: 40px;
      border-radius: 50%; font-size: 20px; cursor: pointer;
    }
    @media (max-width: 700px) {
      .sidebar { width: 100%; }
      .chat-area { display: none; }
      .app.chat-aberto .sidebar { display: none; }
      .app.chat-aberto .chat-area { display: flex; }
    }
    .btn-voltar {
      display: none; background: transparent; border: none;
      color: #e9edef; font-size: 20px; cursor: pointer; margin-right: 4px;
    }
    @media (max-width: 700px) { .btn-voltar { display: block; } }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>Atendimento</h1>
        <button class="btn-novo" onclick="abrirModalNovo()">+ Novo</button>
      </div>
      <div class="search-box">
        <input type="text" id="busca" placeholder="Buscar cliente..." oninput="filtrarClientes()">
      </div>
      <div class="lista-clientes" id="listaClientes">
        <div class="vazio-lista">Carregando...</div>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="chat-vazio" id="chatVazio">
        <div class="icone">💬</div>
        <h2>Painel de Atendimento</h2>
        <p>Selecione um cliente ou crie um novo.</p>
      </div>

      <div id="chatAtivo" style="display:none; flex-direction:column; height:100%; flex:1; min-height:0;">
        <div class="chat-header">
          <button class="btn-voltar" onclick="fecharChatMobile()">←</button>
          <div class="avatar" id="chatAvatar">?</div>
          <div class="chat-header-info">
            <h2 id="chatNome">Cliente</h2>
            <span>Online</span>
          </div>
          <button class="btn-copiar-link" onclick="copiarLinkCliente()">📋 Link</button>
        </div>
        <div id="messages"></div>
        <div class="input-area">
          <button class="btn-midia" onclick="escolherArquivo('imagem')" title="Foto">📷</button>
          <button class="btn-midia" onclick="escolherArquivo('video')" title="Vídeo">🎬</button>
          <button class="btn-midia" onclick="escolherArquivo('arquivo')" title="Arquivo">📎</button>
          <button class="btn-midia" onclick="escolherArquivo('audio')" title="Áudio">🎤</button>
          <input type="file" id="fileInput" onchange="enviarArquivo(event)">
          <input type="text" id="messageInput" placeholder="Digite uma mensagem..." autocomplete="off">
          <button id="sendBtn" onclick="enviarMensagem()">➤</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalNovo">
    <div class="modal">
      <h3>Novo Cliente</h3>
      <input type="text" id="inputNome" placeholder="Nome do cliente" maxlength="50">
      <div class="modal-botoes">
        <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
        <button class="btn-criar" onclick="criarCliente()">Criar</button>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="fecharLightbox()">
    <button class="fechar" onclick="fecharLightbox()">✕</button>
    <img id="lightboxImg" src="" alt="">
  </div>

  <script>
    const SUPABASE_URL = 'https://hthcmhbcgmwprhgubiuy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Z_4elpCD5ygI-SV_2ljJug_gHW0ipa2';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let conversas = [];
    let conversaAtual = null;
    let channelMensagens = null;
    let isCliente = false;
    let tipoArquivoAtual = 'arquivo';

    // Pede permissões ao carregar (câmera/microfone)
    async function pedirPermissoes() {
      try {
        // Só pede se o navegador suportar
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          // Não força agora para não assustar; pede quando clicar no áudio/foto
        }
      } catch(e) {}
    }

    function detectarModo() {
      const params = new URLSearchParams(window.location.search);
      const sala = params.get('sala');
      isCliente = params.get('cliente') === '1';
      if (sala && isCliente) {
        document.querySelector('.sidebar').style.display = 'none';
        abrirConversaPorId(sala);
      } else {
        carregarConversas();
      }
      pedirPermissoes();
    }

    async function carregarConversas() {
      const { data, error } = await supabaseClient
        .from('conversas').select('*').order('updated_at', { ascending: false });
      if (error) {
        document.getElementById('listaClientes').innerHTML = '<div class="vazio-lista">Erro ao carregar</div>';
        return;
      }
      conversas = data || [];
      renderizarLista();
    }

    function renderizarLista(filtro = '') {
      const container = document.getElementById('listaClientes');
      let lista = filtro ? conversas.filter(c => c.nome.toLowerCase().includes(filtro.toLowerCase())) : conversas;
      if (lista.length === 0) {
        container.innerHTML = '<div class="vazio-lista">Nenhum cliente ainda.<br>Clique em "+ Novo".</div>';
        return;
      }
      container.innerHTML = lista.map(c => {
        const ativo = conversaAtual && conversaAtual.id === c.id ? 'ativo' : '';
        return `<div class="cliente-item ${ativo}" onclick="abrirConversa('${c.id}')">
          <div class="avatar">${c.nome.charAt(0).toUpperCase()}</div>
          <div class="cliente-info">
            <div class="cliente-nome">${escapeHtml(c.nome)}</div>
            <div class="cliente-preview">Clique para abrir</div>
          </div>
          <div class="cliente-hora">${formatarHora(c.updated_at)}</div>
        </div>`;
      }).join('');
    }

    function filtrarClientes() {
      renderizarLista(document.getElementById('busca').value);
    }

    function abrirModalNovo() {
      document.getElementById('modalNovo').classList.add('ativo');
      document.getElementById('inputNome').value = '';
      setTimeout(() => document.getElementById('inputNome').focus(), 100);
    }
    function fecharModal() {
      document.getElementById('modalNovo').classList.remove('ativo');
    }

    async function criarCliente() {
      const nome = document.getElementById('inputNome').value.trim();
      if (!nome) return alert('Digite o nome do cliente');
      const id = Math.random().toString(36).substring(2, 10) + Date.now().toString(36).slice(-4);
      const { error } = await supabaseClient.from('conversas').insert([{ id, nome }]);
      if (error) return alert('Erro: ' + error.message);
      fecharModal();
      await carregarConversas();
      abrirConversa(id);
      mostrarToast('Cliente criado!');
    }

    document.getElementById('inputNome').addEventListener('keypress', e => {
      if (e.key === 'Enter') criarCliente();
    });

    async function abrirConversa(id) {
      let conversa = conversas.find(c => c.id === id);
      if (!conversa) {
        const { data } = await supabaseClient.from('conversas').select('*').eq('id', id).single();
        if (!data) return alert('Conversa não encontrada');
        conversaAtual = data;
      } else {
        conversaAtual = conversa;
      }
      mostrarChatUI();
      await carregarMensagens();
      escutarMensagens();
    }

    async function abrirConversaPorId(id) {
      const { data, error } = await supabaseClient.from('conversas').select('*').eq('id', id).single();
      if (error || !data) {
        document.getElementById('chatArea').innerHTML = '<div class="chat-vazio"><h2>Conversa não encontrada</h2></div>';
        return;
      }
      conversas = [data];
      conversaAtual = data;
      document.querySelector('.sidebar').style.display = 'none';
      const btn = document.querySelector('.btn-copiar-link');
      if (btn) btn.style.display = 'none';
      mostrarChatUI();
      await carregarMensagens();
      escutarMensagens();
    }

    function mostrarChatUI() {
      document.getElementById('chatVazio').style.display = 'none';
      const el = document.getElementById('chatAtivo');
      el.style.display = 'flex';
      el.style.flexDirection = 'column';
      el.style.height = '100%';
      el.style.flex = '1';
      el.style.minHeight = '0';
      document.getElementById('chatNome').textContent = conversaAtual.nome;
      document.getElementById('chatAvatar').textContent = conversaAtual.nome.charAt(0).toUpperCase();
      document.getElementById('app').classList.add('chat-aberto');
      renderizarLista(document.getElementById('busca')?.value || '');
      setTimeout(() => document.getElementById('messageInput')?.focus(), 200);
    }

    function fecharChatMobile() {
      document.getElementById('app').classList.remove('chat-aberto');
      conversaAtual = null;
      if (channelMensagens) {
        supabaseClient.removeChannel(channelMensagens);
        channelMensagens = null;
      }
    }

    async function carregarMensagens() {
      if (!conversaAtual) return;
      const { data, error } = await supabaseClient
        .from('mensagens').select('*')
        .eq('conversa_id', conversaAtual.id)
        .order('created_at', { ascending: true });
      const container = document.getElementById('messages');
      container.innerHTML = '';
      if (error) return console.error(error);
      (data || []).forEach(msg => adicionarMensagemNaTela(msg));
      scrollParaBaixo();
    }

    function escutarMensagens() {
      if (channelMensagens) supabaseClient.removeChannel(channelMensagens);
      if (!conversaAtual) return;
      channelMensagens = supabaseClient
        .channel('msgs-' + conversaAtual.id)
        .on('postgres_changes', {
          event: 'INSERT', schema: 'public', table: 'mensagens',
          filter: 'conversa_id=eq.' + conversaAtual.id
        }, payload => {
          adicionarMensagemNaTela(payload.new);
          scrollParaBaixo();
        })
        .subscribe();
    }

    function adicionarMensagemNaTela(msg) {
      if (document.querySelector('[data-id="' + msg.id + '"]')) return;
      const div = document.createElement('div');
      const souEu = isCliente ? (msg.remetente === 'cliente') : (msg.remetente === 'agente');
      div.className = 'msg ' + (souEu ? 'eu' : 'outro');
      div.setAttribute('data-id', msg.id);

      const tipo = (msg.tipo || 'texto').toLowerCase();
      const url = (msg.url_midia || '').trim();
      const hora = new Date(msg.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

      // Constrói o conteúdo de forma segura (sem template string quebrando URL)
      if (url && (tipo === 'imagem' || tipo === 'image' || tipo === 'foto')) {
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'imagem';
        img.loading = 'lazy';
        img.style.maxWidth = '100%';
        img.style.maxHeight = '280px';
        img.style.borderRadius = '8px';
        img.style.display = 'block';
        img.style.marginBottom = '4px';
        img.style.cursor = 'pointer';
        img.onclick = function() { abrirLightbox(url); };
        img.onerror = function() {
          const a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.style.color = '#7dd3c0';
          a.textContent = '📷 Abrir imagem';
          img.replaceWith(a);
        };
        div.appendChild(img);
      } else if (url && tipo === 'video') {
        const video = document.createElement('video');
        video.src = url;
        video.controls = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.style.maxWidth = '100%';
        video.style.maxHeight = '280px';
        video.style.borderRadius = '8px';
        video.style.display = 'block';
        video.style.marginBottom = '4px';
        video.style.background = '#000';
        div.appendChild(video);
      } else if (url && tipo === 'audio') {
        const audio = document.createElement('audio');
        audio.src = url;
        audio.controls = true;
        audio.preload = 'metadata';
        audio.style.width = '100%';
        audio.style.minWidth = '200px';
        audio.style.margin = '4px 0';
        div.appendChild(audio);
      } else if (url) {
        const a = document.createElement('a');
        a.className = 'arquivo';
        a.href = url;
        a.target = '_blank';
        a.innerHTML = '<span style="font-size:24px">📄</span><span>' + escapeHtml(msg.texto || 'Baixar arquivo') + '</span>';
        div.appendChild(a);
      }

      if (msg.texto && tipo === 'texto') {
        const span = document.createElement('span');
        span.textContent = msg.texto;
        div.appendChild(span);
      }

      const horaDiv = document.createElement('div');
      horaDiv.className = 'hora';
      horaDiv.textContent = hora;
      div.appendChild(horaDiv);

      document.getElementById('messages').appendChild(div);
    }

    function abrirLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.add('ativo');
    }
    function fecharLightbox() {
      document.getElementById('lightbox').classList.remove('ativo');
    }

    async function enviarMensagem() {
      if (!conversaAtual) return;
      const input = document.getElementById('messageInput');
      const texto = input.value.trim();
      if (!texto) return;
      const remetente = isCliente ? 'cliente' : 'agente';
      input.value = '';
      document.getElementById('sendBtn').disabled = true;
      const { error } = await supabaseClient.from('mensagens').insert([{
        conversa_id: conversaAtual.id, texto, remetente, tipo: 'texto'
      }]);
      await supabaseClient.from('conversas')
        .update({ updated_at: new Date().toISOString() })
        .eq('id', conversaAtual.id);
      document.getElementById('sendBtn').disabled = false;
      input.focus();
      if (error) mostrarToast('Erro: ' + error.message, true);
    }

    function escolherArquivo(tipo) {
      tipoArquivoAtual = tipo;
      const input = document.getElementById('fileInput');
      if (tipo === 'imagem') input.accept = 'image/*';
      else if (tipo === 'video') input.accept = 'video/*';
      else if (tipo === 'audio') input.accept = 'audio/*';
      else input.accept = '*/*';
      input.click();
    }

    async function enviarArquivo(event) {
      const file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file || !conversaAtual) return;

      if (file.size > 25 * 1024 * 1024) {
        mostrarToast('Arquivo muito grande (máx 25MB)', true);
        return;
      }

      const toast = document.createElement('div');
      toast.className = 'uploading';
      toast.textContent = 'Enviando... aguarde';
      document.body.appendChild(toast);

      try {
        // Detecta tipo pelo MIME se necessário
        let tipo = tipoArquivoAtual;
        if (file.type.startsWith('image/')) tipo = 'imagem';
        else if (file.type.startsWith('video/')) tipo = 'video';
        else if (file.type.startsWith('audio/')) tipo = 'audio';
        else if (tipoArquivoAtual === 'arquivo') tipo = 'arquivo';

        const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
        const nomeArquivo = conversaAtual.id + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) + '.' + ext;

        // Upload
        const { data: uploadData, error: uploadError } = await supabaseClient.storage
          .from('midias')
          .upload(nomeArquivo, file, {
            cacheControl: '3600',
            upsert: false,
            contentType: file.type || 'application/octet-stream'
          });

        if (uploadError) {
          console.error('Upload error:', uploadError);
          throw new Error(uploadError.message || 'Falha no upload');
        }

        // URL pública
        const { data: urlData } = supabaseClient.storage
          .from('midias')
          .getPublicUrl(nomeArquivo);

        const url = urlData.publicUrl;
        if (!url) throw new Error('Não foi possível gerar URL do arquivo');

        const remetente = isCliente ? 'cliente' : 'agente';
        const texto = (tipo === 'arquivo') ? file.name : (file.name || '');

        const { error: msgError } = await supabaseClient.from('mensagens').insert([{
          conversa_id: conversaAtual.id,
          texto: texto,
          remetente: remetente,
          tipo: tipo,
          url_midia: url
        }]);

        if (msgError) {
          console.error('Msg error:', msgError);
          throw new Error(msgError.message || 'Erro ao salvar mensagem');
        }

        await supabaseClient.from('conversas')
          .update({ updated_at: new Date().toISOString() })
          .eq('id', conversaAtual.id);

        mostrarToast('Enviado!');

      } catch (err) {
        console.error(err);
        mostrarToast('Erro: ' + (err.message || 'Falha ao enviar'), true);
      } finally {
        toast.remove();
      }
    }

    document.getElementById('messageInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') { e.preventDefault(); enviarMensagem(); }
    });

    function copiarLinkCliente() {
      if (!conversaAtual) return;
      let base = window.location.href.split('?')[0].split('#')[0];
      const link = base + '?sala=' + conversaAtual.id + '&cliente=1';
      prompt('Copie o link e envie para o cliente:', link);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(link).then(() => mostrarToast('Link copiado!')).catch(() => {});
      }
    }

    function formatarHora(data) {
      if (!data) return '';
      const d = new Date(data);
      const agora = new Date();
      if (agora - d < 86400000 && d.getDate() === agora.getDate()) {
        return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      }
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function scrollParaBaixo() {
      const c = document.getElementById('messages');
      if (c) c.scrollTop = c.scrollHeight;
    }

    function mostrarToast(texto, erro = false) {
      const t = document.createElement('div');
      t.className = 'toast' + (erro ? ' erro' : '');
      t.textContent = texto;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    detectarModo();
  </script>
</body>
</html>
